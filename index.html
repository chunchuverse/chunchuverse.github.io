<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>팀 배정</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=SUIT:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eefcff;
      --panel: rgba(255, 255, 255, 0.82);
      --ink: #163240;
      --muted: #5b7380;
      --line: rgba(11, 126, 154, 0.14);
      --accent: #27c7d9;
      --accent-strong: #109fca;
      --accent-soft: #b7f5fa;
      --shadow: 0 22px 50px rgba(20, 104, 133, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "SUIT", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(39, 199, 217, 0.24), transparent 25%),
        radial-gradient(circle at top right, rgba(16, 159, 202, 0.22), transparent 24%),
        linear-gradient(180deg, #ddfbff 0%, #effeff 46%, #edf8fb 100%);
    }

    .page-shell {
      width: min(1480px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 36px;
    }

    .tab-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      justify-content: space-between;
    }

    .tab-button,
    button,
    input {
      font: inherit;
    }

    .tab-button,
    button {
      border: 0;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .tab-button {
      padding: 12px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: var(--ink);
      font-weight: 800;
      text-shadow: 0 1px 3px rgba(255,255,255,0.6);
    }

    .tab-button.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: white;
      text-shadow: none;
      border-color: transparent;
      box-shadow: 0 12px 24px rgba(16, 159, 202, 0.24);
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    .panel {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      padding: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .panel-row,
    .stepper,
    .inline-form,
    .team-actions,
    .result-head {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .panel-row {
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .teams-top {
      flex-wrap: wrap;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.96);
      color: var(--ink);
      outline: none;
    }

    input:focus {
      border-color: rgba(39, 199, 217, 0.55);
      box-shadow: 0 0 0 4px rgba(39, 199, 217, 0.14);
    }

    .ghost-button,
    .text-button,
    .stepper button {
      padding: 11px 14px;
      border-radius: 14px;
      background: rgba(22, 50, 64, 0.07);
      color: var(--ink);
      font-weight: 800;
    }

    .inline-form input {
      width: auto;
      flex: 1;
      min-width: 0;
    }

    .inline-form button {
      padding: 11px 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: white;
      font-weight: 800;
      white-space: nowrap;
      flex-shrink: 0;
      box-shadow: 0 12px 24px rgba(16, 159, 202, 0.22);
    }

    .stepper {
      padding: 4px;
      border-radius: 18px;
      background: rgba(22, 50, 64, 0.05);
    }

    .stepper input {
      width: 72px;
      text-align: center;
      border: 0;
      box-shadow: none;
      background: transparent;
    }

    .slot-input-grid {
      display: grid;
      gap: 6px;
    }

    .top-grid {
      margin-bottom: 0;
    }

    .bottom-grid {
      margin-top: 0;
    }

    .slot-input-grid input {
      padding: 8px 10px;
      font-size: 13px;
      border-radius: 10px;
      text-align: center;
    }

    .ladder-container {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 18px;
      margin-bottom: 16px;
    }

    .ladder-board-wrap {
      padding: 10px;
      border-radius: 24px;
      border: 1px solid rgba(22, 50, 64, 0.08);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.96), rgba(236,252,255,0.98)),
        repeating-linear-gradient(90deg, transparent, transparent 32px, rgba(16, 159, 202, 0.03) 32px, rgba(16, 159, 202, 0.03) 33px);
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    #ladder-canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    .result-box {
      padding: 16px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(22, 50, 64, 0.08);
      height: fit-content;
    }

    .result-head {
      justify-content: space-between;
      margin-bottom: 12px;
      font-weight: 800;
    }

    .result-list {
      display: grid;
      gap: 10px;
      max-height: 400px;
      overflow-y: auto;
    }

    .result-list.empty {
      color: var(--muted);
    }

    .result-item {
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(22, 50, 64, 0.08);
      font-weight: 700;
      font-size: 14px;
      word-break: break-word;
    }

    .name-bank,
    .team-slot {
      min-height: 88px;
      padding: 12px;
      border-radius: 18px;
      border: 1px dashed rgba(16, 159, 202, 0.22);
      background: rgba(255, 255, 255, 0.82);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-content: flex-start;
    }

    .name-bank-panel {
      margin-bottom: 16px;
    }

    .name-bank-head,
    .team-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .name-bank-title {
      color: var(--ink);
      font-size: 14px;
      font-weight: 800;
    }

    .member-count {
      flex: 0 0 auto;
      min-width: 42px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(22, 50, 64, 0.08);
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
      text-align: center;
    }

    .name-bank {
      margin-bottom: 0;
      max-height: min(34vh, 320px);
      overflow-y: auto;
    }

    .name-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-width: 72px;
      padding: 10px 14px;
      border-radius: 999px;
      background: linear-gradient(135deg, #6ba4b9, #8fc8d5);
      color: white;
      font-weight: 800;
      box-shadow: 0 8px 16px rgba(65, 104, 118, 0.17);
      user-select: none;
    }

    .name-tag.dragging {
      opacity: 0.55;
    }

    .name-tag-del {
      background: none;
      border: none;
      color: rgba(255,255,255,0.65);
      font-size: 14px;
      padding: 0 2px;
      cursor: pointer;
      line-height: 1;
      font-weight: 400;
      transition: color 0.15s;
    }

    .name-tag-del:hover {
      color: white;
    }

    .ladder-name-wrap {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .ladder-del-btn {
      flex: 0 0 auto;
      padding: 6px 9px;
      border-radius: 8px;
      background: rgba(22, 50, 64, 0.08);
      color: var(--muted);
      font-size: 13px;
      border: none;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .ladder-del-btn:hover {
      background: rgba(220, 50, 50, 0.12);
      color: #e04040;
    }

    .dropzone.over {
      background: rgba(183, 245, 250, 0.45);
      border-color: rgba(16, 159, 202, 0.48);
    }

    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
    }

    .team-card {
      padding: 14px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(22, 50, 64, 0.08);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .team-card input {
      margin-bottom: 10px;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.7);
    }

    .team-card-head input {
      flex: 1 1 auto;
      min-width: 0;
      margin-bottom: 0;
    }

    .team-card-head .member-count {
      margin-left: auto;
    }

    .team-reset-buttons {
      margin-bottom: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    @media (max-width: 1024px) {
      .ladder-container {
        grid-template-columns: 1fr;
      }

      .result-box {
        height: auto;
      }
    }

    @media (max-width: 760px) {
      .page-shell {
        width: min(100% - 16px, 1480px);
        padding-top: 16px;
      }

      .panel {
        padding: 16px;
        border-radius: 22px;
      }

      .panel-row {
        flex-direction: column;
        align-items: stretch;
      }

      .tab-bar,
      .team-actions {
        flex-wrap: wrap;
      }

      .inline-form {
        flex-wrap: nowrap;
      }

      .ladder-container {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .team-reset-buttons {
        width: 100%;
      }

      .team-reset-buttons button {
        flex: 1;
      }
    }

    /* 카드 뽑기 */
    .card-layout {
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-height: clamp(620px, calc(100vh - 210px), 860px);
    }

    .card-main {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      gap: 18px;
      min-height: 0;
    }

    .card-range-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .card-range-row input {
      width: 90px;
      text-align: center;
      padding: 10px 12px;
      border-radius: 14px;
    }

    .card-range-label {
      font-weight: 700;
      color: var(--muted);
      font-size: 15px;
    }

    .card-display {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: clamp(360px, 52vh, 620px);
      border-radius: 24px;
      border: 1px solid rgba(22, 50, 64, 0.08);
      background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(236,252,255,0.98));
      gap: 16px;
    }

    .card-number {
      font-size: clamp(120px, 22vh, 240px);
      font-weight: 800;
      color: var(--ink);
      line-height: 1;
      transition: transform 0.1s ease;
    }

    .card-number.pop {
      transform: scale(1.18);
    }

    .card-number.empty {
      font-size: clamp(48px, 10vh, 96px);
      color: var(--muted);
      font-weight: 500;
    }

    .card-sub {
      font-size: clamp(15px, 2.2vh, 22px);
      color: var(--muted);
      font-weight: 600;
    }

    .card-draw-btn {
      width: 100%;
      padding: clamp(18px, 2.6vh, 28px);
      border-radius: 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: white;
      font-size: 17px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      box-shadow: 0 12px 24px rgba(16, 159, 202, 0.28);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card-draw-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 32px rgba(16, 159, 202, 0.34);
    }

    .card-draw-btn:disabled {
      background: rgba(22, 50, 64, 0.12);
      color: var(--muted);
      box-shadow: none;
      transform: none;
      cursor: not-allowed;
    }

    .card-log-box {
      padding: 16px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(22, 50, 64, 0.08);
      display: flex;
      flex: 0 0 auto;
      flex-direction: column;
      gap: 12px;
    }

    .card-log-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
    }

    .card-log-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
      max-height: min(22vh, 220px);
      overflow-y: auto;
    }

    .card-log-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,0.94);
      border: 1px solid rgba(22,50,64,0.08);
      font-weight: 700;
    }

    .card-log-order {
      font-size: 12px;
      color: var(--muted);
      min-width: 24px;
    }

    .card-log-num {
      font-size: 18px;
      font-weight: 800;
      color: var(--accent-strong);
    }

    .card-remain {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    .card-remain.error {
      color: #e04040;
    }

    .card-range-row input.input-error {
      border-color: rgba(220, 50, 50, 0.6);
      box-shadow: 0 0 0 4px rgba(220, 50, 50, 0.1);
    }

    @media (max-width: 760px) {
      .card-layout {
        min-height: calc(100vh - 160px);
      }

      .card-display {
        min-height: clamp(320px, 48vh, 520px);
      }

      .card-log-list {
        grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
      }
    }

    /* ── 핀볼 입력기 ── */
    .pinball-layout {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 16px;
    }

    .pinball-left {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .pinball-error {
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(220, 50, 50, 0.08);
      border: 1px solid rgba(220, 50, 50, 0.25);
      color: #c0392b;
      font-size: 13px;
      font-weight: 600;
    }

    .pinball-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .pinball-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(22, 50, 64, 0.08);
    }

    .pinball-item-name {
      flex: 1;
      font-weight: 700;
      font-size: 15px;
    }

    .pinball-item-count {
      font-size: 20px;
      font-weight: 800;
      color: var(--accent-strong);
      min-width: 36px;
      text-align: center;
    }

    .pinball-item-btns {
      display: flex;
      gap: 4px;
    }

    .pinball-item-btns button {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(22, 50, 64, 0.07);
      border: none;
      cursor: pointer;
      font-weight: 800;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .pinball-item-btns button:hover {
      background: rgba(22, 50, 64, 0.14);
    }

    .pinball-item-btns .del-btn {
      color: #e04040;
    }

    .pinball-item-btns .del-btn:hover {
      background: rgba(220, 50, 50, 0.12);
    }

    .pinball-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .pinball-summary-item {
      padding: 6px 12px;
      border-radius: 10px;
      background: rgba(22, 50, 64, 0.06);
      font-size: 12px;
      font-weight: 700;
    }

    .pinball-summary-total {
      background: rgba(39, 199, 217, 0.13);
      border: 1px solid rgba(39, 199, 217, 0.3);
      color: var(--accent-strong);
    }

    .pinball-output {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.8;
      word-break: break-all;
      user-select: all;
    }

    .pinball-output.has-data {
      color: var(--ink);
      font-weight: 500;
    }

    .pinball-empty {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 24px 0;
    }

    @media (max-width: 1024px) {
      .pinball-layout {
        grid-template-columns: 1fr;
      }
    }

    /* ── 음량 조절 (삭제됨) ── */
    .volume-control-unused {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(22, 50, 64, 0.06);
      width: fit-content;
    }

    .volume-control label {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
    }

    .volume-control input[type="range"] {
      width: 120px;
      height: 5px;
      border-radius: 3px;
      background: rgba(22, 50, 64, 0.15);
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    .volume-control input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(16, 159, 202, 0.3);
    }

    .volume-control input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      cursor: pointer;
      border: none;
      box-shadow: 0 2px 6px rgba(16, 159, 202, 0.3);
    }

    .volume-mute-btn {
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(22, 50, 64, 0.1);
      border: none;
      color: var(--ink);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    .volume-mute-btn:hover {
      background: rgba(22, 50, 64, 0.18);
    }

    .volume-mute-btn.muted {
      color: #e04040;
      background: rgba(220, 50, 50, 0.1);
    }

    /* ── 설정 메뉴 ── */
    /* QR 코드 탭 */
    .qr-layout {
      display: flex;
      gap: 32px;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    .qr-inputs {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 260px;
    }
    .qr-label {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.03em;
      margin-bottom: 2px;
      display: block;
    }
    .qr-url-input,
    .qr-title-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1.5px solid rgba(22,50,64,0.15);
      background: rgba(255,255,255,0.7);
      font-size: 0.95rem;
      color: var(--ink);
      outline: none;
      box-sizing: border-box;
    }
    .qr-url-input:focus,
    .qr-title-input:focus {
      border-color: rgba(22,50,64,0.4);
    }
    .qr-color-row {
      display: flex;
      gap: 20px;
    }
    .qr-color-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .qr-color-picker {
      width: 52px;
      height: 36px;
      border: none;
      border-radius: 8px;
      padding: 2px;
      cursor: pointer;
      background: none;
    }
    .qr-result {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    #qr-canvas-wrap canvas,
    #qr-canvas-wrap img {
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(22,50,64,0.13);
      display: block;
    }
    .qr-action-row {
      display: flex;
      gap: 10px;
    }
    .qr-copy-msg {
      font-size: 0.85rem;
      color: var(--muted);
      min-height: 1.2em;
    }

    .settings-btn {
      padding: 10px;
      border-radius: 12px;
      background: rgba(22, 50, 64, 0.08);
      border: none;
      color: var(--ink);
      font-size: 20px;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 40px;
      height: 40px;
    }

    .settings-btn:hover {
      background: rgba(22, 50, 64, 0.15);
    }

    .settings-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;

  <script>
    const ladderCountInput = document.querySelector("#ladder-count");
    const ladderCanvas = document.querySelector("#ladder-canvas");
    const ladderTopInputs = document.querySelector("#ladder-top-inputs");
    const ladderBottomInputs = document.querySelector("#ladder-bottom-inputs");
    const ladderResultList = document.querySelector("#ladder-result-list");

    const teamGrid = document.querySelector("#team-grid");
    const nameBank = document.querySelector("#name-bank");
    const teamNameInput = document.querySelector("#team-name-input");

    const audioState = {
      ctx: null,
      volume: 0.5,
      muted: false,
    };
    window.__appAudio = audioState; // 설정 스크립트와 공유 (스크립트 오류와 무관하게 즉시 노출)

    const ladderState = {
      count: 4,
      names: ["천양", "마다옴", "모카", "문모모"],
      results: ["1팀", "2팀", "꽝", "보너스"],
      rows: [],
      activeIndex: null,
      highlightSegments: [],
      finalResults: [],
      animationToken: 0,
      runAllToken: 0,
    };

    const TEAM_COLORS = [
      { bg: "rgba(107, 164, 185, 0.13)", border: "rgba(107, 164, 185, 0.30)", tag: "linear-gradient(135deg,#6ba4b9,#8fc8d5)" },
      { bg: "rgba(118, 170, 133, 0.13)", border: "rgba(118, 170, 133, 0.30)", tag: "linear-gradient(135deg,#76aa85,#9ac8a5)" },
      { bg: "rgba(205, 151, 91, 0.13)",  border: "rgba(205, 151, 91, 0.30)",  tag: "linear-gradient(135deg,#cd975b,#e0b77b)" },
      { bg: "rgba(151, 124, 194, 0.13)", border: "rgba(151, 124, 194, 0.30)", tag: "linear-gradient(135deg,#977cc2,#b4a0d4)" },
      { bg: "rgba(199, 121, 159, 0.13)", border: "rgba(199, 121, 159, 0.30)", tag: "linear-gradient(135deg,#c7799f,#dd9cb7)" },
      { bg: "rgba(194, 163, 77, 0.13)",  border: "rgba(194, 163, 77, 0.30)",  tag: "linear-gradient(135deg,#c2a34d,#d8bf72)" },
      { bg: "rgba(197, 111, 111, 0.13)", border: "rgba(197, 111, 111, 0.30)", tag: "linear-gradient(135deg,#c56f6f,#dc9292)" },
      { bg: "rgba(99, 169, 160, 0.13)",  border: "rgba(99, 169, 160, 0.30)",  tag: "linear-gradient(135deg,#63a9a0,#89c8c0)" },
    ];

    const teamState = {
      nextId: 1,
      names: [],
      teams: [
        { id: 1, name: "1팀" },
        { id: 2, name: "2팀" },
      ],
    };

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function getAudioContext() {
      if (!audioState.ctx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) {
          return null;
        }
        audioState.ctx = new AudioContextClass();
      }
      return audioState.ctx;
    }

    function playTone({ frequency = 440, duration = 0.12, type = "sine", gain = 0.05, slideTo } = {}) {
      const ctx = getAudioContext();
      if (!ctx || audioState.muted) {
        return;
      }

      if (ctx.state === "suspended") {
        ctx.resume();
      }

      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const amp = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(frequency, now);
      if (slideTo) {
        osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
      }
      const finalGain = gain * audioState.volume;
      amp.gain.setValueAtTime(0.0001, now);
      amp.gain.exponentialRampToValueAtTime(finalGain, now + 0.01);
      amp.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      osc.connect(amp).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + duration + 0.02);
    }

    function playLadderSound() {
      playTone({ frequency: 460, duration: 0.08, type: "triangle", gain: 0.12, slideTo: 620 });
      setTimeout(() => {
        playTone({ frequency: 680, duration: 0.08, type: "triangle", gain: 0.1, slideTo: 820 });
      }, 70);
    }

    function playDropSound() {
      // 부드러운 낮은 음: sine파, 하강 피치, 낮은 gain
      playTone({ frequency: 300, duration: 0.12, type: "sine", gain: 0.05, slideTo: 180 });
    }

    function setGridColumns(element, count) {
      element.style.gridTemplateColumns = `repeat(${count}, minmax(0, 1fr))`;
    }

    function ensureLadderLists() {
      while (ladderState.names.length < ladderState.count) {
        ladderState.names.push("");
      }
      while (ladderState.results.length < ladderState.count) {
        ladderState.results.push("");
      }
      ladderState.names = ladderState.names.slice(0, ladderState.count);
      ladderState.results = ladderState.results.slice(0, ladderState.count);
    }

    function buildLadderRows(count) {
      const totalRows = clamp(16 + Math.floor(count * 0.2), 16, 18);
      const rows = Array.from({ length: totalRows }, () => Array(count - 1).fill(null));
      const directions = [-1, 0, 1];
      const createBridge = () => ({ direction: directions[Math.floor(Math.random() * directions.length)] });
      const countBridges = () => rows.reduce((sum, row) => sum + row.filter(Boolean).length, 0);
      const columnHasBridge = (column) => rows.some((row) => Boolean(row[column]));
      const laneHasBridge = (lane) => rows.some((row) => Boolean(row[lane] || row[lane - 1]));
      const fixedBridgeCounts = { 6: 12, 7: 14, 8: 16, 9: 18, 10: 21, 11: 23, 12: 25 };
      const randomBridgeRanges = { 2: [2, 3], 3: [4, 5], 4: [6, 7], 5: [8, 10] };
      const bridgeRange = randomBridgeRanges[count];
      const targetBridgeCount = bridgeRange
        ? bridgeRange[0] + Math.floor(Math.random() * (bridgeRange[1] - bridgeRange[0] + 1))
        : fixedBridgeCounts[count];
      const getCandidates = (column) => rows
        .map((row, rowIndex) => ({ row, rowIndex }))
        .filter(({ row }) => !row[column] && !row[column - 1] && !row[column + 1]);
      const placeBridge = (targetColumn, direction = null) => {
        const column = clamp(targetColumn, 0, count - 2);
        const candidates = getCandidates(column);
        if (!candidates.length) return false;
        const picked = candidates[Math.floor(Math.random() * candidates.length)];
        picked.row[column] = direction === null ? createBridge() : { direction };
        return true;
      };

      for (let column = 0; column < count - 1; column += 1) {
        if (!columnHasBridge(column)) {
          placeBridge(column);
        }
      }

      for (let lane = 0; lane < count; lane += 1) {
        if (!laneHasBridge(lane)) {
          placeBridge(lane === count - 1 ? lane - 1 : lane);
        }
      }

      let guard = 0;
      while (guard < count * totalRows) {
        const missingColumn = Array.from({ length: count - 1 }, (_, column) => column).find((column) => !columnHasBridge(column));
        const missingLane = Array.from({ length: count }, (_, lane) => lane).find((lane) => !laneHasBridge(lane));
        if (missingColumn === undefined && missingLane === undefined) {
          break;
        }
        placeBridge(missingColumn !== undefined ? missingColumn : (missingLane === count - 1 ? missingLane - 1 : missingLane));
        guard += 1;
      }

      guard = 0;
      while (countBridges() < targetBridgeCount && guard < count * totalRows) {
        placeBridge(Math.floor(Math.random() * (count - 1)));
        guard += 1;
      }

      const bridgeCells = [];
      rows.forEach((row) => {
        row.forEach((bridge) => {
          if (bridge) bridgeCells.push(bridge);
        });
      });
      if (bridgeCells.length >= 3) {
        bridgeCells[0].direction = -1;
        bridgeCells[Math.floor(bridgeCells.length / 2)].direction = 0;
        bridgeCells[bridgeCells.length - 1].direction = 1;
      }

      return rows;
    }

    function getLadderMetrics() {
      const canvas = ladderCanvas;
      const ctx = canvas.getContext("2d");
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const width = rect.width || canvas.width;
      const height = rect.height || canvas.height;
      const pixelWidth = Math.round(width * dpr);
      const pixelHeight = Math.round(height * dpr);
      if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
        canvas.width = pixelWidth;
        canvas.height = pixelHeight;
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const paddingX = 50;
      const spacing = ladderState.count > 1 ? (width - paddingX * 2) / (ladderState.count - 1) : 0;
      const textSize = getLadderTextSize(spacing);
      const paddingTop = Math.max(44, textSize + 26);
      const paddingBottom = Math.max(58, textSize + 42);
      const rowGap = (height - paddingTop - paddingBottom) / ((ladderState.rows.length || 1) + 1);
      return { ctx, width, height, paddingX, paddingY: paddingTop, paddingBottom, spacing, rowGap, textSize };
    }

    function getBridgeEndpointYs(bridgeY, diagonalOffset, bridge) {
      if (bridge.direction === 0) {
        return { leftY: bridgeY, rightY: bridgeY };
      }
      if (bridge.direction === -1) {
        return { leftY: bridgeY + diagonalOffset, rightY: bridgeY - diagonalOffset };
      }
      return { leftY: bridgeY - diagonalOffset, rightY: bridgeY + diagonalOffset };
    }

    function traceLadder(startIndex) {
      const { paddingX, paddingY, paddingBottom, height, spacing, rowGap } = getLadderMetrics();
      const diagonalOffset = Math.max(4, Math.min(rowGap * 0.32, 18));
      let lane = startIndex;
      let x = paddingX + spacing * lane;
      let y = paddingY;
      const segments = [];

      ladderState.rows.forEach((row, rowIndex) => {
        const bridgeY = paddingY + rowGap * (rowIndex + 1);
        const rightBridge = row[lane];
        const leftBridge = lane > 0 ? row[lane - 1] : null;

        if (rightBridge) {
          const nextX = paddingX + spacing * (lane + 1);
          const { leftY, rightY } = getBridgeEndpointYs(bridgeY, diagonalOffset, rightBridge);
          segments.push({ x1: x, y1: y, x2: x, y2: leftY });
          segments.push({ x1: x, y1: leftY, x2: nextX, y2: rightY });
          lane += 1;
          x = nextX;
          y = rightY;
        } else if (leftBridge) {
          const nextX = paddingX + spacing * (lane - 1);
          const { leftY, rightY } = getBridgeEndpointYs(bridgeY, diagonalOffset, leftBridge);
          segments.push({ x1: x, y1: y, x2: x, y2: rightY });
          segments.push({ x1: x, y1: rightY, x2: nextX, y2: leftY });
          lane -= 1;
          x = nextX;
          y = leftY;
        } else {
          segments.push({ x1: x, y1: y, x2: x, y2: bridgeY });
          y = bridgeY;
        }
      });

      const endY = height - paddingBottom;
      segments.push({ x1: x, y1: y, x2: x, y2: endY });

      return { segments, endIndex: lane };
    }

    function renderLadderResults() {
      if (!ladderState.finalResults.length) {
        ladderResultList.className = "result-list empty";
        ladderResultList.textContent = "아직 결과가 없습니다.";
        return;
      }

      ladderResultList.className = "result-list";
      ladderResultList.innerHTML = "";

      ladderState.finalResults.forEach((entry) => {
        const item = document.createElement("div");
        item.className = "result-item";
        item.textContent = `${entry.name || "이름 없음"} → ${entry.result || "결과 없음"}`;
        ladderResultList.appendChild(item);
      });
    }

    function deleteLadderLane(index) {
      if (ladderState.count <= 2) return;
      ladderState.names.splice(index, 1);
      ladderState.results.splice(index, 1);
      ladderState.count -= 1;
      ladderCountInput.value = String(ladderState.count);
      ladderState.rows = buildLadderRows(ladderState.count);
      ladderState.activeIndex = null;
      ladderState.highlightSegments = [];
      ladderState.finalResults = [];
      renderLadderInputs();
      renderLadder();
      renderLadderResults();
    }

    function renderLadderInputs() {
      ladderTopInputs.innerHTML = "";
      ladderBottomInputs.innerHTML = "";
      setGridColumns(ladderTopInputs, ladderState.count);
      setGridColumns(ladderBottomInputs, ladderState.count);

      ladderState.names.forEach((name, index) => {

    function getLadderTextSize(spacing) {
      const sizeByCount = 26 - ladderState.count;
      const sizeBySpacing = Math.floor(spacing * 0.28);
      return clamp(Math.min(sizeByCount, sizeBySpacing), 13, 22);
    }

    function drawLadderText(ctx, text, x, y, maxWidth, baseSize, color) {
      let size = baseSize;
      ctx.fillStyle = color;
      ctx.font = `800 ${size}px SUIT, sans-serif`;
      while (size > 11 && ctx.measureText(text).width > maxWidth) {
        size -= 1;
        ctx.font = `800 ${size}px SUIT, sans-serif`;
      }
      ctx.fillText(text, x, y);
    }

    function renderLadder() {
      const { ctx, width, height, paddingX, paddingY, paddingBottom, spacing, rowGap, textSize } = getLadderMetrics();
      const diagonalOffset = Math.max(4, Math.min(rowGap * 0.32, 18));
      ctx.clearRect(0, 0, width, height);
      ctx.lineCap = "round";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const textMaxWidth = Math.max(34, spacing - 14);
      for (let lane = 0; lane < ladderState.count; lane += 1) {
        const x = paddingX + spacing * lane;
        const name = ladderState.names[lane] || `?? ${lane + 1}`;
        const color = ladderState.activeIndex === lane ? "#FF0000" : "#163240";
        drawLadderText(ctx, name, x, paddingY / 2, textMaxWidth, textSize, color);
      }

      for (let lane = 0; lane < ladderState.count; lane += 1) {
        const x = paddingX + spacing * lane;
        ctx.beginPath();
        ctx.strokeStyle = "#11536a";
        ctx.lineWidth = 4;
        ctx.moveTo(x, paddingY);
        ctx.lineTo(x, height - paddingBottom);
        ctx.stroke();
      }

      ladderState.rows.forEach((row, rowIndex) => {
        const bridgeY = paddingY + rowGap * (rowIndex + 1);
        row.forEach((bridge, column) => {
          if (!bridge) return;
          const startX = paddingX + spacing * column;
          const endX = paddingX + spacing * (column + 1);
          const { leftY, rightY } = getBridgeEndpointYs(bridgeY, diagonalOffset, bridge);
          ctx.beginPath();
          ctx.strokeStyle = bridge.direction === 0 ? "#23a8c7" : "#16b8d4";
          ctx.lineWidth = 6;
          ctx.moveTo(startX, leftY);
          ctx.lineTo(endX, rightY);
          ctx.stroke();
        });
      });

      ladderState.highlightSegments.forEach((segment, index) => {
        ctx.beginPath();
        ctx.strokeStyle = index === ladderState.highlightSegments.length - 1 ? "#FF0000" : "#FF6666";
        ctx.lineWidth = 8;
        ctx.moveTo(segment.x1, segment.y1);
        ctx.lineTo(segment.x2, segment.y2);
        ctx.stroke();
      });

      for (let lane = 0; lane < ladderState.count; lane += 1) {
        const x = paddingX + spacing * lane;
        const result = ladderState.results[lane] || `?? ${lane + 1}`;
        drawLadderText(ctx, result, x, height - paddingBottom / 2, textMaxWidth, textSize, "#163240");
      }
    }

    function getLadderStepDelay() {
      return clamp(120 - ladderState.count * 7, 38, 105);
    }

    function getLadderRunPause() {
      return clamp(520 - ladderState.count * 32, 110, 420);
    }

    function animateLadderPath(segments, onComplete) {
      ladderState.animationToken += 1;
      const token = ladderState.animationToken;
      const stepDelay = getLadderStepDelay();
      ladderState.highlightSegments = [];
      renderLadder();
      let index = 0;

      const timer = setInterval(() => {
        if (token !== ladderState.animationToken) {
          clearInterval(timer);
          return;
        }

        ladderState.highlightSegments.push(segments[index]);
        renderLadder();
        index += 1;

        if (index >= segments.length) {
          clearInterval(timer);
          if (onComplete) onComplete();
        }
      }, stepDelay);
    }

    function runLadder(startIndex, onDone) {
      ladderState.activeIndex = startIndex;
      playLadderSound();

      const traced = traceLadder(startIndex);

      animateLadderPath(traced.segments, () => {
        const name = ladderState.names[startIndex] || `이름 ${startIndex + 1}`;
        const result = ladderState.results[traced.endIndex] || `결과 ${traced.endIndex + 1}`;
        const existing = ladderState.finalResults.findIndex((entry) => entry.index === startIndex);

        if (existing >= 0) {
          ladderState.finalResults[existing] = { index: startIndex, name, result };
        } else {
          ladderState.finalResults.push({ index: startIndex, name, result });
        }

        ladderState.finalResults.sort((a, b) => a.index - b.index);
        renderLadderResults();
        if (onDone) onDone();
      });
    }

    function runAllLadder() {
      ladderState.runAllToken += 1;
      const runToken = ladderState.runAllToken;
      ladderState.finalResults = [];
      ladderState.activeIndex = null;
      ladderState.highlightSegments = [];
      renderLadder();
      renderLadderResults();

      const indices = Array.from({ length: ladderState.count }, (_, i) => i);
      let i = 0;

      function next() {
        if (runToken !== ladderState.runAllToken) return;
        if (i >= indices.length) return;
        const idx = indices[i++];
        runLadder(idx, () => {
          if (runToken !== ladderState.runAllToken) return;
          setTimeout(next, getLadderRunPause());
        });
      }

      next();
    }

    function resetLadder() {
      ladderState.runAllToken += 1;
      ladderState.animationToken += 1;
      ladderState.count = clamp(Number(ladderCountInput.value) || 2, 2, 12);
      ladderCountInput.value = String(ladderState.count);
      ensureLadderLists();
      ladderState.rows = buildLadderRows(ladderState.count);
      ladderState.activeIndex = null;
      ladderState.highlightSegments = [];
      ladderState.finalResults = [];
      renderLadderInputs();
      renderLadder();
      renderLadderResults();
    }

    function copyTeamResults() {

    function bindDropzones() {
      document.querySelectorAll(".dropzone").forEach((zone) => {
        // addEventListener 대신 직접 할당 → 중복 리스너 누적 방지
        zone.ondragover = (event) => {
          event.preventDefault();
          zone.classList.add("over");
        };

        zone.ondragleave = () => {
          zone.classList.remove("over");
        };

        zone.ondrop = (event) => {
          event.preventDefault();
          zone.classList.remove("over");
          const id = Number(event.dataTransfer?.getData("text/plain"));

    function parseTeamNames(value) {

      const clickX = event.clientX - rect.left;
      const clickY = event.clientY - rect.top;
      const { paddingX, paddingY, spacing } = getLadderMetrics();

      if (clickY < paddingY) {
        let closestLane = 0;
        let minDist = Infinity;
        for (let lane = 0; lane < ladderState.count; lane += 1) {
          const dist = Math.abs(clickX - (paddingX + spacing * lane));
          if (dist < minDist) { minDist = dist; closestLane = lane; }
        }
        runLadder(closestLane);
      }

    ["천양","김웰로","나나문","달타","마다옴","모카","문모모","임하밍","카푸","캬앙","플리","체비"].forEach(addName);

    // ── 카드 뽑기 ──────────────────────────────────────
    const cardMinInput  = document.querySelector("#card-min");
    const cardMaxInput  = document.querySelector("#card-max");
    const cardNumberEl  = document.querySelector("#card-number");
    const cardSubEl     = document.querySelector("#card-sub");
    const cardRemainEl  = document.querySelector("#card-remain");
    const cardDrawBtn   = document.querySelector("#card-draw");
    const cardLogList   = document.querySelector("#card-log-list");

    const cardState = {
      pool: [],
      drawn: [],
    };

    function validateCardInputs() {
      const minVal = cardMinInput.value.trim();
      const maxVal = cardMaxInput.value.trim();
      const min = parseInt(minVal, 10);
      const max = parseInt(maxVal, 10);

      cardMinInput.classList.remove("input-error");
      cardMaxInput.classList.remove("input-error");
      cardRemainEl.classList.remove("error");

      if (minVal === "" || isNaN(min)) {
        cardMinInput.classList.add("input-error");
        cardRemainEl.classList.add("error");
        cardRemainEl.textContent = "시작 숫자를 입력해주세요.";
        return null;
      }
      if (maxVal === "" || isNaN(max)) {
        cardMaxInput.classList.add("input-error");
        cardRemainEl.classList.add("error");
        cardRemainEl.textContent = "끝 숫자를 입력해주세요.";
        return null;
      }
      if (min > max) {
        cardMinInput.classList.add("input-error");
        cardMaxInput.classList.add("input-error");
        cardRemainEl.classList.add("error");
        cardRemainEl.textContent = "시작 숫자가 끝 숫자보다 클 수 없습니다.";
        return null;
      }
      if (max - min > 9999) {
        cardMaxInput.classList.add("input-error");
        cardRemainEl.classList.add("error");
        cardRemainEl.textContent = "범위가 너무 큽니다. (최대 10,000개)";
        return null;
      }
      // 소수점 입력 시 정수로 고정
      cardMinInput.value = String(min);
      cardMaxInput.value = String(max);
      return { min, max };
    }

    function buildCardPool() {
      const valid = validateCardInputs();
      if (!valid) return false;
      const { min, max } = valid;
      cardState.pool = [];
      for (let i = min; i <= max; i++) cardState.pool.push(i);
      cardState.drawn = [];
      return true;
    }

    function updateCardRemain() {
      const remain = cardState.pool.length;
      const total = cardState.pool.length + cardState.drawn.length;
      cardRemainEl.classList.remove("error");
      cardRemainEl.textContent = remain > 0
        ? `남은 카드: ${remain} / ${total}`
        : "모든 카드를 뽑았습니다!";
      cardDrawBtn.disabled = remain === 0;
    }

    function resetCard() {
      const ok = buildCardPool();
      if (!ok) {
        cardDrawBtn.disabled = true;
        return;
      }
      cardNumberEl.className = "card-number empty";
      cardNumberEl.textContent = "?";
      cardSubEl.textContent = "버튼을 눌러 뽑기";
      updateCardRemain();
    }

    function drawCard() {
      if (cardState.pool.length === 0) return;
      const idx = Math.floor(Math.random() * cardState.pool.length);
      const num = cardState.pool.splice(idx, 1)[0];
      cardState.drawn.push(num);

      // 숫자 표시
      cardNumberEl.className = "card-number";
      cardNumberEl.textContent = String(num);
      cardNumberEl.classList.add("pop");
      setTimeout(() => cardNumberEl.classList.remove("pop"), 200);

      cardSubEl.textContent = `${cardState.drawn.length}번째 뽑기`;

      // 로그 추가
      if (cardState.drawn.length === 1) cardLogList.innerHTML = "";
      const item = document.createElement("div");
      item.className = "card-log-item";
      item.innerHTML = `<span class="card-log-order">${cardState.drawn.length}</span><span class="card-log-num">${num}</span>`;
      cardLogList.prepend(item);

      updateCardRemain();
      playTone({ frequency: 520, duration: 0.1, type: "triangle", gain: 0.15, slideTo: 780 });
    }

    document.querySelector("#card-draw").addEventListener("click", drawCard);
    document.querySelector("#card-reset").addEventListener("click", resetCard);

      cardLogList.innerHTML = `<div style="color:var(--muted);font-size:13px;">아직 뽑은 카드가 없습니다.</div>`;
    });

    const pinballInputEl  = document.querySelector("#pinball-input");
    const pinballErrorEl  = document.querySelector("#pinball-error");
    const pinballListEl   = document.querySelector("#pinball-list");
    const pinballSummaryEl = document.querySelector("#pinball-summary");
    const pinballOutputEl = document.querySelector("#pinball-output");

    const pinballState = { entries: [] }; // [{ name, count }]

    function parsePinballToken(raw) {
      const trimmed = raw.trim();
      if (!trimmed) return { error: "\uC774\uB984\uC744 \uC785\uB825\uD574\uC8FC\uC138\uC694." };
      const slashes = trimmed.split("/").length - 1;
      if (slashes === 0) {
        return { name: trimmed, count: 1 };
      }
      if (slashes > 1) return { error: "\uC2AC\uB798\uC2DC(/)\uB294 \uD558\uB098\uB9CC \uC0AC\uC6A9\uD574\uC8FC\uC138\uC694." };
      const [namePart, numPart] = trimmed.split("/");
      const name = namePart.trim();
      const count = parseInt(numPart.trim(), 10);
      if (!name) return { error: "\uC774\uB984\uC744 \uC785\uB825\uD574\uC8FC\uC138\uC694." };
      if (numPart.trim() === "" || isNaN(count)) return { error: "\uAC2F\uC218\uB294 \uC22B\uC790\uB85C \uC785\uB825\uD574\uC8FC\uC138\uC694." };
      if (count < 1) return { error: "\uAC2F\uC218\uB294 1 \uC774\uC0C1\uC774\uC5B4\uC57C \uD569\uB2C8\uB2E4." };
      if (count > 999) return { error: "\uAC2F\uC218\uB294 999 \uC774\uD558\uB85C \uC785\uB825\uD574\uC8FC\uC138\uC694." };
      return { name, count };
    }

    function showPinballError(msg) {
      pinballErrorEl.textContent = msg;
      pinballErrorEl.style.display = "";
      pinballInputEl.style.borderColor = "rgba(220,50,50,0.6)";
      pinballInputEl.style.boxShadow = "0 0 0 4px rgba(220,50,50,0.1)";
    }

    function hidePinballError() {
      pinballErrorEl.style.display = "none";
      pinballInputEl.style.borderColor = "";
      pinballInputEl.style.boxShadow = "";
    }

    function renderPinballOutput() {
      const { entries } = pinballState;
      if (entries.length === 0) {
        pinballSummaryEl.innerHTML = "";
        pinballOutputEl.textContent = "\uC544\uC9C1 \uD56D\uBAA9\uC774 \uC5C6\uC2B5\uB2C8\uB2E4.";
        pinballOutputEl.className = "pinball-output";
        return;
      }

      const total = entries.reduce((s, e) => s + e.count, 0);
      pinballSummaryEl.innerHTML =
        entries.map((e) => "<div class=\"pinball-summary-item\">" + e.name + " <span style=\"color:var(--accent-strong)\">" + e.count + "\uAC1C</span></div>").join("") +
        "<div class=\"pinball-summary-item pinball-summary-total\">\uD569\uACC4 " + total + "\uAC1C</div>";

      const output = entries.map((e) => e.name + "*" + e.count).join(",");
      pinballOutputEl.textContent = output;
      pinballOutputEl.className = "pinball-output has-data";
    }

    function renderPinballList() {
      const { entries } = pinballState;
      if (entries.length === 0) {
        pinballListEl.innerHTML = "<div class=\"pinball-empty\">\uD56D\uBAA9\uC744 \uC785\uB825\uD558\uACE0 Enter\uB97C \uB204\uB974\uC138\uC694.</div>";
        return;
      }

      pinballListEl.innerHTML = "";
      entries.forEach((entry, idx) => {
        const item = document.createElement("div");
        item.className = "pinball-item";

        const nameEl = document.createElement("div");
        nameEl.className = "pinball-item-name";
        nameEl.textContent = entry.name;

        const countEl = document.createElement("div");
        countEl.className = "pinball-item-count";
        countEl.textContent = entry.count;

        const btns = document.createElement("div");
        btns.className = "pinball-item-btns";

        const minusBtn = document.createElement("button");
        minusBtn.textContent = "\u2212";
        minusBtn.onclick = () => {
          entry.count -= 1;
          if (entry.count <= 0) pinballState.entries.splice(idx, 1);
          renderPinballList();
          renderPinballOutput();
          playTone({ frequency: 380, duration: 0.06, type: "triangle", gain: 0.1, slideTo: 280 });
        };

        const plusBtn = document.createElement("button");
        plusBtn.textContent = "+";
        plusBtn.onclick = () => {
          if (entry.count < 999) entry.count += 1;
          renderPinballList();
          renderPinballOutput();
          playTone({ frequency: 620, duration: 0.06, type: "triangle", gain: 0.1, slideTo: 780 });
        };

        const delBtn = document.createElement("button");
        delBtn.textContent = "\u00D7";
        delBtn.className = "del-btn";
        delBtn.onclick = () => {
          pinballState.entries.splice(idx, 1);
          renderPinballList();
          renderPinballOutput();
          playTone({ frequency: 300, duration: 0.1, type: "square", gain: 0.1, slideTo: 150 });
        };

        btns.append(minusBtn, plusBtn, delBtn);
        item.append(nameEl, countEl, btns);
        pinballListEl.appendChild(item);
      });
    }

    pinballInputEl.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      e.preventDefault();
      const result = parsePinballToken(pinballInputEl.value);
      if (result.error) { showPinballError(result.error); return; }
      hidePinballError();
      const existing = pinballState.entries.find(en => en.name === result.name);
      if (existing) { existing.count += result.count; }
      else { pinballState.entries.push({ name: result.name, count: result.count }); }
      pinballInputEl.value = "";
      renderPinballList();
      renderPinballOutput();
      playTone({ frequency: 520, duration: 0.08, type: "triangle", gain: 0.12, slideTo: 720 });
    });

    pinballInputEl.addEventListener("input", () => {
      if (pinballInputEl.value === "") hidePinballError();
    });

    document.querySelector("#pinball-copy").addEventListener("click", () => {
      if (!pinballState.entries.length) return;
      const text = pinballOutputEl.textContent;
      const btn = document.querySelector("#pinball-copy");
      const original = btn ? btn.textContent : "";
      navigator.clipboard.writeText(text).then(() => {
        if (!btn) return;
        btn.textContent = "복사됨 ✓";
        setTimeout(() => { btn.textContent = original; }, 1500);
      }).catch(() => {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.cssText = "position:fixed;opacity:0;";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        if (!btn) return;
        btn.textContent = "복사됨 ✓";
        setTimeout(() => { btn.textContent = original; }, 1500);
      });
    });

    document.querySelector("#pinball-reset").addEventListener("click", () => {
      if (!confirm("정말 모든 항목을 삭제하시겠습니까?")) return;
      pinballState.entries = [];
      pinballInputEl.value = "";
      hidePinballError();
      renderPinballList();
      renderPinballOutput();
    });

  </script>

  <!-- 설정 패널 전용 스크립트 (기존 스크립트 에러와 완전히 독립) -->
  <script>
    (function () {
      // audioState fallback: 기존 스크립트가 에러나도 동작하도록
      var audio = window.__appAudio || { volume: 0.5, muted: false };
      if (!window.__appAudio) window.__appAudio = audio;

      var modal     = document.getElementById("settings-modal");
      var volEl     = document.getElementById("settings-volume");
      var volText   = document.getElementById("settings-volume-text");
      var soundOn   = document.getElementById("settings-sound-on");
      var soundOff  = document.getElementById("settings-sound-off");
      var closeBtn  = document.getElementById("settings-close");
      var colorBtns = document.querySelectorAll(".settings-color-btn");

      var BG = {
        "default":      "linear-gradient(135deg, #ddfbff 0%, #effeff 46%, #edf8fb 100%), radial-gradient(circle at top left, rgba(39,199,217,0.24), transparent 25%), radial-gradient(circle at top right, rgba(16,159,202,0.22), transparent 24%)",
        "dark":         "#2d3e50",
        "light":        "#f8f9fa",
        "pastel-blue":  "#e3f2fd",
        "pastel-pink":  "#fce4ec",
        "pastel-green": "#e8f5e9",
      };

      function lsSet(key, value) {
        try { localStorage.setItem(key, value); } catch (e) {}
      }
      function lsGet(key) {
        try { return localStorage.getItem(key); } catch (e) { return null; }
      }

      function applyBg(color) {
        document.body.style.background = BG[color] || BG["default"];
        lsSet("bgColor", color);
        colorBtns.forEach(function (b) {
          b.classList.toggle("active", b.dataset.color === color);
        });
      }

      function setMuted(muted) {
        audio.muted = muted;
        soundOn.classList.toggle("active", !muted);
        soundOff.classList.toggle("active", muted);
        lsSet("muted", muted ? "true" : "false");
      }

      function setVolume(v) {
        audio.volume = v / 100;
        volEl.value  = v;
        volText.textContent = v + "%";
        lsSet("volume", v);
      }

      // 닫기
      if (closeBtn) closeBtn.onclick = function () { modal.classList.remove("active"); };
      if (modal)    modal.onclick    = function (e) { if (e.target === modal) modal.classList.remove("active"); };

      // 음량 슬라이더
      if (volEl) volEl.oninput = function () {
        var v = parseInt(this.value, 10);
        setVolume(v);
        setMuted(false);
      };

      // 음소거 토글
      if (soundOn)  soundOn.onclick  = function () { setMuted(false); };
      if (soundOff) soundOff.onclick = function () { setMuted(true);  };

      // 배경색
      colorBtns.forEach(function (btn) {
        btn.onclick = function () { applyBg(btn.dataset.color); };
      });

      // 초기 설정 불러오기
      var savedVolume = parseInt(lsGet("volume") || "50", 10);
      if (isNaN(savedVolume) || savedVolume < 0 || savedVolume > 200) savedVolume = 50;
      var savedMuted  = lsGet("muted") === "true";
      var savedBg     = lsGet("bgColor") || "default";

      setVolume(savedVolume);
      setMuted(savedMuted);
      applyBg(savedBg);
    })();
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    (function () {
      var urlInput    = document.getElementById("qr-url-input");
      var titleInput  = document.getElementById("qr-title-input");
      var fgPicker    = document.getElementById("qr-fg-color");
      var borderPicker= document.getElementById("qr-border-color");
      var titleColorPicker = document.getElementById("qr-title-color");
      var generateBtn = document.getElementById("qr-generate-btn");
      var result      = document.getElementById("qr-result");
      var canvasWrap  = document.getElementById("qr-canvas-wrap");
      var copyBtn     = document.getElementById("qr-copy-btn");
      var downloadBtn = document.getElementById("qr-download-btn");
      var copyMsg     = document.getElementById("qr-copy-msg");

      var qrInstance = null;
      var PAD        = 20;  // 외곽선과 QR 사이 여백(px)
      var BORDER_W   = 3;   // 외곽선 두께(px)
      var RADIUS     = 16;  // 외곽선 라운드(px)
      var QR_SIZE    = 240;

      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.arcTo(x + w, y,     x + w, y + r,     r);
        ctx.lineTo(x + w, y + h - r);
        ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
        ctx.lineTo(x + r, y + h);
        ctx.arcTo(x,     y + h, x,     y + h - r, r);
        ctx.lineTo(x, y + r);
        ctx.arcTo(x, y,     x + r, y,             r);
        ctx.closePath();
      }

      function drawFinal(qrCanvas) {
        var margin = PAD + BORDER_W;
        var title = titleInput ? titleInput.value.trim() : "";
        var titleChars = Array.from(title);
        if (titleChars.length > 24) {
          title = titleChars.slice(0, 24).join("");
          if (titleInput) titleInput.value = title;
        }
        var titleSpace = title ? 46 : 0;
        var total  = QR_SIZE + margin * 2;
        var out    = document.createElement("canvas");
        out.width  = total;
        out.height = total + titleSpace;
        var ctx    = out.getContext("2d");

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, out.width, out.height);

        ctx.drawImage(qrCanvas, margin, margin, QR_SIZE, QR_SIZE);

        if (title) {
          ctx.fillStyle = titleColorPicker ? titleColorPicker.value : "#163240";
          ctx.font = "800 20px SUIT, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          var maxWidth = total - margin * 2;
          var titleParts = Array.from(title);
          var titleText = title;
          for (var cut = titleParts.length; cut > 0 && ctx.measureText(titleText).width > maxWidth; cut -= 1) {
            titleText = titleParts.slice(0, Math.max(1, cut - 1)).join("") + "...";
          }
          ctx.fillText(titleText, total / 2, total + titleSpace / 2 - 2);
        }

        ctx.strokeStyle = borderPicker.value;
        ctx.lineWidth   = BORDER_W;
        var half = BORDER_W / 2;
        roundRect(ctx, half, half, total - BORDER_W, out.height - BORDER_W, RADIUS);
        ctx.stroke();

        canvasWrap.innerHTML = "";
        out.style.boxShadow = "0 4px 20px rgba(22,50,64,0.15)";
        canvasWrap.appendChild(out);
      }

      function generate() {
        var url = urlInput.value.trim();
        if (!url) { urlInput.focus(); return; }

        // 임시 div에 QR 렌더링 후 canvas를 꺼내서 drawFinal 호출
        var tmp = document.createElement("div");
        tmp.style.position = "absolute";
        tmp.style.visibility = "hidden";
        document.body.appendChild(tmp);

        qrInstance = new QRCode(tmp, {
          text: url,
          width: QR_SIZE,
          height: QR_SIZE,
          colorDark: fgPicker.value,
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H,
        });

        // QRCode.js는 동기적으로 canvas를 그리지만 이미지 생성은 약간 지연될 수 있음
        setTimeout(function () {
          var qrCanvas = tmp.querySelector("canvas");
          if (qrCanvas) drawFinal(qrCanvas);
          document.body.removeChild(tmp);
          result.style.display = "flex";
          copyMsg.textContent = "";
        }, 50);
      }

      generateBtn.onclick = generate;

      [urlInput, titleInput].forEach(function (input) {
        if (!input) return;
        input.addEventListener("keydown", function (e) {
          if (e.key === "Enter") generate();
        });
      });

      // 색상 변경 시 자동 재생성
      fgPicker.oninput = function () { if (qrInstance) generate(); };
      borderPicker.oninput = function () { if (qrInstance) generate(); };
      titleInput.oninput = function () { if (qrInstance) generate(); };
      titleColorPicker.oninput = function () { if (qrInstance) generate(); };

      function getFinalCanvas() {
        return canvasWrap.querySelector("canvas");
      }

      copyBtn.onclick = function () {
        var canvas = getFinalCanvas();
        if (!canvas) return;
        canvas.toBlob(function (blob) {
          if (!blob) return;
          try {
            navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]).then(function () {
              copyMsg.textContent = "클립보드에 복사됐어요 ✓";
              setTimeout(function () { copyMsg.textContent = ""; }, 2000);
            }).catch(function () {
              copyMsg.textContent = "복사 실패 (브라우저 권한 필요)";
            });
          } catch (e) {
            copyMsg.textContent = "이 브라우저는 이미지 복사를 지원하지 않아요";
          }
        });
      };

      downloadBtn.onclick = function () {
        var canvas = getFinalCanvas();
        if (!canvas) return;
        var a = document.createElement("a");
        a.href = canvas.toDataURL("image/png");
        a.download = "qrcode.png";
        a.click();
      };
    })();
  </script>
